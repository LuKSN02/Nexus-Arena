<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Você está offline — Nexus Arena</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<style>
  :root{
    --bg:#0a0d14; --surface:#12151f; --border:#262b3d; --text:#e9ebf2; --text-dim:#9096ac; --signal:#ff3b5c;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, 'Inter', sans-serif; text-align:center; padding:24px;
  }
  .card{ max-width:380px; }
  img{ width:72px; height:72px; border-radius:16px; margin-bottom:22px; }
  h1{ font-size:20px; margin:0 0 10px; }
  p{ font-size:14px; color:var(--text-dim); line-height:1.6; margin:0 0 22px; }
  button{
    background:var(--signal); color:#fff; border:none; padding:11px 22px; border-radius:8px;
    font-size:13.5px; font-weight:700; cursor:pointer;
  }
  button:hover{ opacity:.92; }
</style>
</head>
<body>
  <div class="card">
    <img src="assets/icon-192.png" alt="">
    <h1>Você está sem conexão</h1>
    <p>Não foi possível carregar esta página porque você está offline e ela ainda não tinha sido salva no cache do dispositivo. Verifique sua conexão e tente novamente.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
